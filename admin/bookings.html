      </div>
      <div class="admin-topbar__actions">
        <button id="new-booking-btn" class="btn btn--save btn--sm">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>

          Refresh
        </button>
      </div>
    </div>

    <div class="admin-listbar">
      <div class="admin-tabs" id="booking-status-tabs">

        <button class="admin-tab" data-status="pending">Pending <span class="admin-tab__count">0</span></button>
        <button class="admin-tab" data-status="paid">Paid <span class="admin-tab__count">0</span></button>
        <button class="admin-tab" data-status="cancelled">Cancelled <span class="admin-tab__count">0</span></button>
      </div>
      <input type="text" id="booking-search" class="admin-search" placeholder="Search name, email, tour..." style="max-width:220px;">
      <div class="admin-listbar__filters">
        <div class="admin-date-range open">
          <input type="date" id="filter-date-from" class="admin-search">
          <span style="font-size:0.75rem;opacity:0.5;">to</span>
          <input type="date" id="filter-date-to" class="admin-search">
        </div>
      </div>
    </div>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Seaduced Experience</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--admin-bg);
      padding: 1rem;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--admin-card-border);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      backdrop-filter: blur(20px);
    }

    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .login-logo svg {
      width: 32px;
      height: 32px;
      color: var(--admin-accent);
    }

    .login-logo span {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--clr-white);
    }

    .login-title {
      text-align: center;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 1.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .login-field label {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.04em;
    }

    .login-field input {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      color: var(--clr-white);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      box-sizing: border-box;
    }

    .login-field input:focus {
      border-color: var(--admin-accent);
    }

    .login-btn {
      width: 100%;
      padding: 0.85rem;
      background: var(--admin-accent);
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 0.5rem;
    }

    .login-btn:hover { opacity: 0.85; }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .login-error {
      display: none;
      text-align: center;
      color: #ff6b6b;
      font-size: 0.85rem;
      margin-top: 1rem;
    }

    .login-error.visible { display: block; }
  </style>
</head>
<body style="margin:0; background-color: #0a0f1d;">

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5V21M7 16H2M17 16H22M5 16C5 19.866 8.13401 23 12 23C15.866 23 19 19.866 19 16M12 5C13.1046 5 14 4.10457 14 3C14 1.89543 13.1046 1 12 1C10.8954 1 10 1.89543 10 3C10 4.10457 10.8954 5 12 5Z" />
        </svg>
        <span class="logo-text-group" style="display:flex;flex-direction:column;line-height:1.2;">
          <span>Seaduced Experience</span>
          <span style="font-size:0.62rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.4);">Admin Panel</span>
        </span>
      </div>

      <form id="loginForm">
        <div class="login-field">
          <label for="password">Password</label>
          <div style="position:relative;">
            <input type="password" id="password" name="password" autocomplete="current-password" autofocus required style="padding-right:2.75rem;" />
            <button type="button" id="togglePwd" tabindex="-1" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.4);padding:0;line-height:0;">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="login-btn" id="submitBtn">Log in</button>
        <p class="login-error" id="errorMsg">Incorrect password</p>
      </form>

      <form id="otpForm" style="display:none;">
        <p class="login-title" style="margin-bottom:1.25rem;">Enter the code sent to your email</p>
        <div class="login-field">
          <label for="otpCode">Code (6 digits)</label>
          <input type="text" id="otpCode" name="otpCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" autofocus required />
        </div>
        <button type="submit" class="login-btn" id="otpSubmitBtn">Verify</button>
        <p class="login-error" id="otpErrorMsg">Invalid code</p>
      </form>

    </div>
  </div>

  <script>
    document.getElementById('togglePwd').addEventListener('click', () => {
      const input = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.innerHTML = isHidden
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Verifying...';
      errorMsg.classList.remove('visible');

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });

        if (res.ok) {
          document.getElementById('loginForm').style.display = 'none';
          document.getElementById('otpForm').style.display = 'block';
        } else {
          errorMsg.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Log in';
        }
      } catch {
        errorMsg.textContent = 'Connection error';
        errorMsg.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    });

    document.getElementById('otpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('otpSubmitBtn');
      const errorMsg = document.getElementById('otpErrorMsg');
      const code = document.getElementById('otpCode').value.trim();

      btn.disabled = true;
      btn.textContent = 'Verifying...';
      errorMsg.classList.remove('visible');

      try {
        const res = await fetch('/api/admin/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });

        if (res.ok) {
          window.location.href = '/admin';
        } else {
          const data = await res.json().catch(() => ({}));
          errorMsg.textContent = data.error === 'Too many attempts. Try again later.'
            ? 'Too many attempts. Try again later.'
            : 'Invalid or expired code';
          errorMsg.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Verify';
        }
      } catch {
        errorMsg.textContent = 'Connection error';
        errorMsg.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Verify';
      }
    });
  </script>

</body>
</html>
